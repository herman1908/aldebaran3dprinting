; Hardening + mitigasi PHP2Shell (CVE-2026-109618 & CVE-2026-109619).
; Runtime produksi memakai PHP 8.5.12 yang sudah terpatch; ini lapisan tambahan.
expose_php = 0
display_errors = 0
display_startup_errors = 0
log_errors = 1
error_reporting = E_ALL

; Situs tidak memakai session PHP (keranjang memakai cookie), matikan fitur ini
; yang menjadi salah satu jalur pemicu PHP2Shell.
session.upload_progress.enabled = 0

; Batasi body request; form situs hanya mengirim data kecil.
post_max_size = 2M
upload_max_filesize = 2M
